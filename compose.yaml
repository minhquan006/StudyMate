services:
  db:
    image: mysql:8.4@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69
    environment:
      MYSQL_DATABASE: studymate
      MYSQL_USER: studymate
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' --skip-column-names"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/index.php?page=health') === '{\"status\":\"ok\"}' ? 0 : 1);"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_NAME: studymate
      DB_USER: studymate
      DB_PASSWORD: ${DB_PASSWORD}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-StudyMate2026!}
      DB_WAIT_TIMEOUT: ${DB_WAIT_TIMEOUT:-60}
      AI_ENABLED: ${AI_ENABLED:-0}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-${AI_MODEL:-gemini-2.5-flash-lite}}
      HTTPS_ENABLED: "0"
    volumes:
      - private_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
volumes:
  mysql_data:
  private_storage:
